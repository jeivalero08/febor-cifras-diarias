<title>FEBOR · Evolución de Depósitos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --g1:#005648;--g2:#00927A;--g0:#003d32;
  --gold:#FAC616;--gold-l:#fdd84e;--gold-ll:#fff3c0;
  --red:#c0392b;--red-l:#fdecea;--grn:#1a7a42;--grn-l:#e8f5ee;
  --bg:#f5f7f5;--surf:#fff;--bord:#d0e0da;--tx:#1a1a1a;--tx3:#5a8a7a;
  --ff:'Poppins',sans-serif;--fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6}
button{cursor:pointer;font-family:var(--ff);border:none;background:none}
select,input{font-family:var(--ff)}

.load-ov{position:fixed;inset:0;background:var(--g1);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .4s}
.load-ov.gone{opacity:0;pointer-events:none}
.load-bar-bg{width:200px;height:3px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin-top:1.5rem}
.load-bar-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .3s;width:0}
.load-txt{font-size:.72rem;color:rgba(255,255,255,.4);margin-top:.7rem;font-family:var(--fm)}

.hdr{background:var(--g1);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;min-height:62px;position:sticky;top:0;z-index:200;flex-wrap:wrap;gap:.5rem}
.hdr-brand{display:flex;align-items:center;gap:10px;padding:.5rem 0}
.hdr-name{font-size:.95rem;color:#fff;font-weight:600}
.hdr-tag{font-size:.58rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;line-height:1.4}
.hdr-r{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:.5rem 0}
.hdr-date{font-size:.67rem;color:rgba(255,255,255,.35);font-family:var(--fm)}
.btn-h{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:8px;font-size:.74rem;font-weight:500;transition:all .14s;white-space:nowrap}
.btn-h.gold{background:var(--gold);color:var(--g1);font-weight:700}
.btn-h.gold:hover{background:var(--gold-l)}
.btn-h.outline{background:transparent;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2)}
.btn-h.outline:hover{background:rgba(255,255,255,.1)}

.bc{background:var(--g0);padding:.4rem 2rem;display:flex;align-items:center;gap:5px;font-size:.72rem;color:rgba(255,255,255,.4);flex-wrap:wrap}
.bc-item{cursor:pointer;transition:color .13s}
.bc-item:hover,.bc-item.on{color:rgba(255,255,255,.9)}
.bc-sep{opacity:.3}

.pg{display:none;padding:1.75rem 2rem 4rem;max-width:1380px;margin:0 auto}
.pg.on{display:block}

/* MENU */
.menu-hdr h1{font-size:1.9rem;font-weight:700;color:var(--g1)}
.menu-hdr p{font-size:.83rem;color:var(--tx3);margin-top:.3rem;margin-bottom:1.4rem}
.menu-hero{background:var(--g1);border-radius:16px;padding:1.5rem 2rem;margin-bottom:1.2rem;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap}
.mh-l .lbl{font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);margin-bottom:.2rem}
.mh-l .val{font-family:var(--fm);font-size:1.75rem;color:var(--gold)}
.mh-l .sub{font-size:.7rem;color:rgba(255,255,255,.3);margin-top:.12rem}
.mh-badges{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.65rem}
.badge{padding:3px 9px;border-radius:20px;font-size:.67rem;font-weight:500;background:rgba(0,146,122,.25);color:#7eeedd}
.badge.gold{background:rgba(250,198,22,.2);color:var(--gold)}
.mh-r .lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.3);margin-bottom:.15rem}
.mh-r .rng{font-size:.8rem;color:rgba(255,255,255,.55);font-family:var(--fm)}
.no-data{background:var(--gold-ll);border:1px solid var(--gold);border-radius:12px;padding:1.1rem 1.4rem;margin-bottom:1.2rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.no-data p{font-size:.8rem;color:var(--g1);font-weight:500}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:.85rem}
.mcard{background:var(--surf);border:1px solid var(--bord);border-radius:16px;padding:1.3rem;cursor:pointer;transition:all .17s;position:relative;overflow:hidden}
.mcard:hover{border-color:var(--g2);transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,86,72,.12)}
.mcard-stripe{position:absolute;top:0;left:0;width:4px;height:100%;background:var(--g2);opacity:0;transition:opacity .18s}
.mcard:hover .mcard-stripe{opacity:1}
.mcard-ico{width:38px;height:38px;background:var(--gold-ll);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin-bottom:.85rem}
.mcard h3{font-size:.9rem;font-weight:600;color:var(--g1);margin-bottom:.25rem}
.mcard p{font-size:.74rem;color:var(--tx3);line-height:1.5}
.mcard-arr{position:absolute;right:.9rem;bottom:.9rem;font-size:.95rem;color:var(--g2)}

/* FILTER BAR */
.sel-bar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:.85rem 1.2rem;margin-bottom:1.5rem}
.sel-bar-title{font-size:.95rem;font-weight:600;color:var(--g1)}
.sel-lbl{font-size:.67rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);white-space:nowrap}
.date-range{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.date-inp{padding:5px 8px;border:1px solid var(--bord);border-radius:4px;font-size:.75rem;color:var(--tx);background:var(--surf);font-family:var(--fm);width:130px}
.date-inp:focus{outline:none;border-color:var(--g2)}
.btn-apply{padding:5px 14px;background:var(--g1);color:#fff;border-radius:4px;font-size:.74rem;font-weight:600}
.btn-apply:hover{background:var(--g2)}
.btn-clr{padding:5px 8px;color:var(--tx3);border-radius:4px;font-size:.74rem}
.sel-sep{width:1px;height:18px;background:var(--bord)}
.qpills{display:flex;gap:.3rem;flex-wrap:wrap}
.qpill{padding:4px 12px;border-radius:20px;font-size:.72rem;border:1px solid var(--bord);color:#3d6b52;background:transparent;transition:all .13s;white-space:nowrap;font-family:var(--ff)}
.qpill:hover{border-color:var(--g2);color:var(--g1)}
.qpill.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.sel-info{font-size:.7rem;color:var(--tx3);font-family:var(--fm)}

/* KPIS */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(162px,1fr));gap:.72rem;margin-bottom:1.4rem}
.kpi{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:.95rem 1.1rem;position:relative;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.kpi:hover{box-shadow:0 4px 16px rgba(0,86,72,.12)}
.kpi-bar{position:absolute;top:0;left:0;width:100%;height:3px}
.kpi-lbl{font-size:.63rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);margin-bottom:.3rem}
.kpi-val{font-family:var(--fm);font-size:1.15rem;font-weight:500;color:var(--tx);line-height:1.1}
.kpi-unit{font-size:.62rem;color:var(--tx3);margin-top:.1rem}
.kpi-d{display:inline-flex;align-items:center;font-size:.67rem;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:.28rem}
.kpi-d.up{background:var(--grn-l);color:var(--grn)}
.kpi-d.dn{background:var(--red-l);color:var(--red)}
.kpi-tot{background:var(--g1);border-color:var(--g0);cursor:default}
.kpi-tot .kpi-lbl{color:rgba(255,255,255,.4)}
.kpi-tot .kpi-val{color:var(--gold)}
.kpi-tot .kpi-unit{color:rgba(255,255,255,.28)}

/* CHARTS */
.crow{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-bottom:.9rem}
.ccard{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:1.2rem 1.3rem}
.ccard.span2{grid-column:1/-1}
.ctop{display:flex;align-items:flex-start;margin-bottom:.9rem}
.ctitle{font-size:.88rem;font-weight:600;color:var(--g1)}
.csub{font-size:.67rem;color:var(--tx3);margin-top:2px}
.cwrap{position:relative;overflow:hidden}.cwrap canvas{max-width:100%}
.h340{height:340px}.h280{height:280px}
.cleg{display:flex;flex-wrap:wrap;gap:9px;margin-top:.8rem}
.cleg-i{display:flex;align-items:center;gap:4px;font-size:.7rem;color:#3d6b52;cursor:pointer}
.cleg-i:hover{opacity:.7}
.cleg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.donut-wrap{position:relative}
.donut-ctr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:100px}
.donut-ctr-val{font-family:var(--fm);font-size:.95rem;font-weight:500;color:var(--tx)}
.donut-ctr-lbl{font-size:.58rem;color:var(--tx3)}

/* TABLE */
.stbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stbl{width:100%;border-collapse:collapse;font-size:.78rem}
.stbl th{text-align:left;padding:.42rem .65rem;font-size:.64rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);border-bottom:2px solid var(--bord)}
.stbl th:not(:first-child){text-align:right}
.stbl td{padding:.48rem .65rem;border-bottom:1px solid var(--bord)}
.stbl td:not(:first-child){text-align:right;font-family:var(--fm);font-size:.75rem}
.stbl tr:hover td{background:#f0f7f5}
.stbl tr:last-child td{border-bottom:none;font-weight:600;color:var(--g1)}
.dc{display:flex;align-items:center;gap:6px}
.dm{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.cup{color:var(--grn);font-weight:600}
.cdn{color:var(--red);font-weight:600}

/* DETAIL */
.det-back{display:flex;align-items:center;gap:5px;font-size:.76rem;color:var(--tx3);cursor:pointer;margin-bottom:1rem;transition:color .13s;font-weight:500}
.det-back:hover{color:var(--g1)}
.det-hero{background:var(--g1);border-radius:20px;padding:1.5rem 1.8rem;margin-bottom:1.25rem}
.det-hero-top{display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:start}
.det-pname{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);margin-bottom:.22rem}
.det-val{font-family:var(--fm);font-size:1.9rem;font-weight:500;color:var(--gold);line-height:1}
.det-unit{font-size:.7rem;color:rgba(255,255,255,.3);margin-top:.28rem}
.det-deltas{display:flex;gap:.45rem;margin-top:.55rem;flex-wrap:wrap}
.det-d{display:inline-flex;align-items:center;font-size:.73rem;font-weight:600;padding:3px 9px;border-radius:20px}
.det-stats-r{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;text-align:center}
.ds-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.35);margin-bottom:.18rem;font-weight:600}
.ds-val{font-family:var(--fm);font-size:.88rem;font-weight:500;color:rgba(255,255,255,.8)}
.shdr{margin-bottom:.7rem}
.shdr-t{font-size:.88rem;font-weight:600;color:var(--g1)}
.shdr-s{font-size:.66rem;color:var(--tx3);margin-top:1px}
.footer{text-align:center;padding:2rem;font-size:.68rem;color:var(--tx3)}

/* RESPONSIVE */
@media(max-width:768px){
  .hdr{padding:0 1rem}
  .pg{padding:1rem 1rem 3rem}
  .bc{padding:.35rem 1rem}
  .crow{grid-template-columns:1fr}
  .ccard.span2{grid-column:1}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi-tot{grid-column:1/-1}
  .h340{height:240px}
  .h280{height:200px}
  .det-hero-top{grid-template-columns:1fr}
  .menu-hero{flex-direction:column}
  .mh-r{display:none}
  .mgrid{grid-template-columns:1fr 1fr}
  .sel-bar{flex-direction:column;align-items:flex-start;gap:.5rem}
  .date-inp{width:120px}
  .hdr-date{display:none}
}
@media(max-width:400px){
  .mgrid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr}
  .kpi-tot{grid-column:1}
}
</style>

<script>
const PM=Object.fromEntries(PRODS.map(p=>[p.k,p]));
PM['Aportes']={k:'Aportes',c:'#7ab8a8'};
const MS=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

let ALL=[], CUR='', G={days:0,from:'',to:''}, D={days:0,from:'',to:''};

const fK=(v,d=2)=>v==null?'—':((v/1e6).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d})+' M');
const fP=(v,d=2)=>v==null||isNaN(v)?'—':(v>=0?'+':'')+v.toFixed(d)+'%';
const fDt=iso=>{if(!iso)return'—';const[y,m,d]=iso.split('-');return`${d}/${m}/${y}`;};

function setLoad(p,t){document.getElementById('loadBar').style.width=p+'%';document.getElementById('loadTxt').textContent=t;}
function hideLoad(){const o=document.getElementById('loadOv');o.classList.add('gone');setTimeout(()=>o.style.display='none',450);}

function initCartera(raw){
  if(!raw||!raw.length)return;
  const seen=new Set();
  CAR_ALL=raw.map(r=>({...r,_d:new Date(r.Fecha+'T12:00:00')}))
    .filter(r=>{if(seen.has(r.Fecha))return false;seen.add(r.Fecha);return true;})
    .sort((a,b)=>a._d-b._d);
}

function initData(raw){
  const seen=new Set();
  ALL=raw.map(r=>({...r,_d:new Date(r.Fecha+'T12:00:00')}))
    .filter(r=>{if(seen.has(r.Fecha))return false;seen.add(r.Fecha);return true;})
    .sort((a,b)=>a._d-b._d);
  const minD=ALL[0]?.Fecha||'', maxD=ALL[ALL.length-1]?.Fecha||'';
  ['gFrom','gTo','dFrom','dTo'].forEach(id=>document.getElementById(id).min=minD);
  ['gFrom','gTo','dFrom','dTo'].forEach(id=>document.getElementById(id).max=maxD);
  document.getElementById('gFrom').value=minD;
  document.getElementById('gTo').value=maxD;
  G={days:0,from:minD,to:maxD};
  if(ALL.length){
    document.getElementById('hdrDate').textContent='Último: '+fDt(ALL[ALL.length-1].Fecha);
    document.getElementById('footer').textContent=`FEBOR · Evolución de Depósitos · ${ALL.length} registros · ${fDt(ALL[ALL.length-1].Fecha)} · Jeisson Alirio Valero Núñez`;
  }
  renderMenuHero();
  setLoad(100,'¡Listo!');
  setTimeout(hideLoad,400);
}

// FILTER
function filtrar(st){
  if(st.days>0){
    const c=new Date(ALL[ALL.length-1]._d);c.setDate(c.getDate()-st.days);
    return ALL.filter(r=>r._d>=c);
  }
  if(st.from&&st.to) return ALL.filter(r=>r.Fecha>=st.from&&r.Fecha<=st.to);
  return [...ALL];
}
function filtrarProd(st,prod){return filtrar(st).filter(r=>r[prod]!=null);}
function infoStr(d){if(!d.length)return'0 registros';return`${fDt(d[0].Fecha)} → ${fDt(d[d.length-1].Fecha)} · ${d.length} días`;}

function clearQ(id){document.querySelectorAll('#'+id+' .qpill').forEach(p=>p.classList.remove('on'));}

// GEN FILTERS
function setQGen(d,btn){G={days:d,from:d>0?'':(ALL[0]?.Fecha||''),to:d>0?'':(ALL[ALL.length-1]?.Fecha||'')}; if(!d){document.getElementById('gFrom').value=ALL[0]?.Fecha||'';document.getElementById('gTo').value=ALL[ALL.length-1]?.Fecha||'';}clearQ('qpGen');btn.classList.add('on');renderGeneral();}
function applyGenDate(){const f=document.getElementById('gFrom').value,t=document.getElementById('gTo').value;if(!f||!t)return;G={days:0,from:f,to:t};clearQ('qpGen');renderGeneral();}
function clearGenDate(){G={days:0,from:ALL[0]?.Fecha||'',to:ALL[ALL.length-1]?.Fecha||''};document.getElementById('gFrom').value=G.from;document.getElementById('gTo').value=G.to;clearQ('qpGen');document.querySelector('#qpGen .qpill:last-child').classList.add('on');renderGeneral();}

// DET FILTERS
function setQDet(d,btn){D={days:d,from:'',to:''};clearQ('qpDet');btn.classList.add('on');renderProd(CUR);}
function applyDetDate(){const f=document.getElementById('dFrom').value,t=document.getElementById('dTo').value;if(!f||!t)return;D={days:0,from:f,to:t};clearQ('qpDet');renderProd(CUR);}
function clearDetDate(){D={days:0,from:ALL[0]?.Fecha||'',to:ALL[ALL.length-1]?.Fecha||''};document.getElementById('dFrom').value=D.from;document.getElementById('dTo').value=D.to;clearQ('qpDet');document.querySelector('#qpDet .qpill:last-child').classList.add('on');renderProd(CUR);}

// NAV
function showPg(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');}
function goMenu(){showPg('pgMenu');setBc('menu');}
function goGeneral(){showPg('pgGeneral');setBc('gen');renderGeneral();}
function goProd(prod){
  CUR=prod;
  const minD=ALL[0]?.Fecha||'',maxD=ALL[ALL.length-1]?.Fecha||'';
  D={days:0,from:minD,to:maxD};
  document.getElementById('dFrom').value=minD;
  document.getElementById('dTo').value=maxD;
  clearQ('qpDet');document.querySelector('#qpDet .qpill:last-child').classList.add('on');
  showPg('pgProd');setBc('prod',prod);renderProd(prod);
}
function setBc(v,prod){
  const bc=document.getElementById('bcNav');
  if(v==='menu'){bc.innerHTML='<span class="bc-item on" onclick="goMenu()">Inicio</span>';return;}
  if(v==='gen'){bc.innerHTML='<span class="bc-item" onclick="goMenu()">Inicio</span><span class="bc-sep">›</span><span class="bc-item on">Vista General</span>';return;}
  if(v==='cartera'){bc.innerHTML='<span class="bc-item" onclick="goMenu()">Inicio</span><span class="bc-sep">›</span><span class="bc-item on">Cartera de Créditos</span>';return;}
  bc.innerHTML=`<span class="bc-item" onclick="goMenu()">Inicio</span><span class="bc-sep">›</span><span class="bc-item" onclick="goGeneral()">Vista General</span><span class="bc-sep">›</span><span class="bc-item on">${prod}</span>`;
}

// MENU HERO
function renderMenuHero(){
  const w=document.getElementById('menuHero');
  if(!ALL.length){w.innerHTML='<div class="no-data"><p>Sin datos. Ejecuta el Actualizar FEBOR.bat para cargar el historial.</p></div>';return;}
  const l=ALL[ALL.length-1],f=ALL[0];
  const tot=PRODS.reduce((s,p)=>s+(l[p.k]||0),0);
  const totF=PRODS.reduce((s,p)=>s+(f[p.k]||0),0);
  const prev=ALL.length>1?ALL[ALL.length-2]:null;
  const totP=prev?PRODS.reduce((s,p)=>s+(prev[p.k]||0),0):null;
  const dD=totP?((tot-totP)/totP*100):null;
  const dT=totF?((tot-totF)/totF*100):null;
  w.innerHTML=`<div class="menu-hero">
    <div class="mh-l">
      <div class="lbl">Saldo total del portafolio</div>
      <div class="val">${fK(tot)} <span style="font-size:.8rem;color:rgba(255,255,255,.25)">millones COP</span></div>
      <div class="sub">Al ${fDt(l.Fecha)}</div>
      <div class="mh-badges">
        ${dD!=null?`<span class="badge gold">${fP(dD)} vs día anterior</span>`:''}
        ${dT!=null?`<span class="badge">${fP(dT)} desde inicio histórico</span>`:''}
        <span class="badge gold">${ALL.length} días registrados</span>
      </div>
    </div>
    <div class="mh-r">
      <div class="lbl">Período disponible</div>
      <div class="rng">${fDt(f.Fecha)}</div>
      <div style="font-size:.62rem;color:rgba(255,255,255,.2);margin:.1rem 0">↓</div>
      <div class="rng">${fDt(l.Fecha)}</div>
    </div>
  </div>`;
}

// GENERAL
function renderGeneral(){
  const data=filtrar(G);
  document.getElementById('genInfo').textContent=infoStr(data);
  if(!data.length)return;
  renderKPIs(data);renderHist(data);renderVar(data);renderDonut(data);renderTable(data);
}

function renderKPIs(data){
  const f=data[0],l=data[data.length-1];
  const tF=PRODS.reduce((s,p)=>s+(f[p.k]||0),0);
  const tL=PRODS.reduce((s,p)=>s+(l[p.k]||0),0);
  const tp=tF?(tL-tF)/tF*100:0;
  let h=`<div class="kpi kpi-tot"><div class="kpi-bar" style="background:var(--gold)"></div>
    <div class="kpi-lbl">Total portafolio</div><div class="kpi-val">${fK(tL)}</div>

    <span class="kpi-d ${tp>=0?'up':'dn'}" style="background:rgba(255,255,255,.1);color:${tp>=0?'#8ff5b0':'#ffaaaa'}">${fP(tp)}</span></div>`;
  PRODS.forEach(p=>{
    const v0=f[p.k],v1=l[p.k];const d=v0&&v1?((v1-v0)/v0*100):null;
    h+=`<div class="kpi" onclick="goProd('${p.k}')"><div class="kpi-bar" style="background:${p.c}"></div>
      <div class="kpi-lbl">${p.k}</div><div class="kpi-val">${v1!=null?fK(v1):'—'}</div>

}

function renderVar(data){
  const byM={};
  data.forEach(r=>{const k=r.Fecha.slice(0,7);if(!byM[k]){byM[k]={s:0,n:0};}const tot=PRODS.reduce((s,p)=>s+(r[p.k]||0),0);byM[k].s+=tot;byM[k].n++;});
  const mks=Object.keys(byM).sort();
  const mavg=mks.map(k=>+(byM[k].s/byM[k].n/1e6).toFixed(2));

  dC('chVar');
  new Chart(document.getElementById('chVar'),{type:'bar',
    data:{labels:mks.map(k=>`${MS[parseInt(k.slice(5,7))]} ${k.slice(2,4)}`),
      datasets:[{label:'Promedio',data:mavg,backgroundColor:colors,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:t=>`Prom: ${t.parsed.y.toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})} M`}}},
      scales:{x:{ticks:{maxTicksLimit:18,font:{size:9},maxRotation:45},grid:{display:false}},
        y:{ticks:{font:{size:10},callback:v=>v.toLocaleString('es-CO',{maximumFractionDigits:0})+' M'},grid:{color:'#e8ede9'}}}}

function renderDonut(data){
  const l=data[data.length-1];
  const vals=PRODS.map(p=>l[p.k]?+(l[p.k]/1e6).toFixed(3):0);
  const total=vals.reduce((a,b)=>a+b,0);
  dC('chDonut');
  document.getElementById('donutTotal').textContent=(total).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})+' M';
  document.getElementById('legDonut').innerHTML=PRODS.map((p,i)=>{
    const pct=total?(vals[i]/total*100).toFixed(1):0;
    return `<span class="cleg-i"><span class="cleg-dot" style="background:${p.c}"></span>${p.k} <strong style="color:var(--tx)">${pct}%</strong></span>`;
  }).join('');
  new Chart(document.getElementById('chDonut'),{type:'doughnut',
    data:{labels:PRODS.map(p=>p.k),datasets:[{data:vals,backgroundColor:PRODS.map(p=>p.c),borderWidth:2,borderColor:'#fff',hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const pct=(ctx.parsed/total*100).toFixed(1);return ` ${ctx.label}: ${ctx.parsed.toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})} M (${pct}%)`;}}}}}
  });
}

function renderTable(data){
  const f=data[0],l=data[data.length-1];let h='',tF=0,tL=0,tA=0;
  PRODS.forEach(p=>{
    const v0=f[p.k],v1=l[p.k];const d=v0&&v1?v1-v0:null,pct=v0&&d?(d/v0*100):null;
    const n=data.filter(r=>r[p.k]).length;const avg=n?data.filter(r=>r[p.k]).reduce((s,r)=>s+r[p.k],0)/n:null;
    if(v0)tF+=v0;if(v1)tL+=v1;if(avg)tA+=avg;
    h+=`<tr><td><span class="dc"><span class="dm" style="background:${p.c}"></span>${p.k}</span></td>
      <td>${v0?fK(v0):'—'}</td><td>${v1?fK(v1):'—'}</td>
      <td class="${d==null?'':d>=0?'cup':'cdn'}">${d!=null?(d>=0?'+':'')+fK(d):'—'}</td>
      <td class="${pct==null?'':pct>=0?'cup':'cdn'}">${pct!=null?fP(pct):'—'}</td>
      <td>${avg?fK(avg):'—'}</td></tr>`;
  });
  const td=tL-tF,tp=tF?(td/tF*100):0;
  h+=`<tr><td>TOTAL</td><td>${fK(tF)}</td><td>${fK(tL)}</td><td class="${td>=0?'cup':'cdn'}">${(td>=0?'+':'')+fK(td)}</td><td class="${td>=0?'cup':'cdn'}">${fP(tp)}</td><td>${fK(tA)}</td></tr>`;
  document.getElementById('stblBody').innerHTML=h;
}

function renderProd(prod){
  const p=PM[prod];if(!p)return;
  const btn=document.getElementById('detBackBtn');
  if(btn){if(prod==='Aportes'){btn.textContent='← Volver al menú';btn.onclick=goMenu;}
  else{btn.textContent='← Volver a vista general';btn.onclick=goGeneral;}}
  const data=filtrarProd(D,prod);
  if(!data.length)return;
  document.getElementById('detBarTitle').textContent=prod;
  document.getElementById('detInfo').textContent=infoStr(data);
  document.getElementById('detChTitle').textContent=`Evolución histórica · ${prod}`;
  const l=data[data.length-1],f=data[0];
  const vals=data.map(r=>r[prod]);
  const minV=Math.min(...vals),maxV=Math.max(...vals),avgV=vals.reduce((a,b)=>a+b,0)/vals.length;
  const pct=f[prod]?((l[prod]-f[prod])/f[prod]*100):null;
  const pi=ALL.findIndex(r=>r.Fecha===l.Fecha)-1;

  const pctD=prev&&prev[prod]?((l[prod]-prev[prod])/prev[prod]*100):null;
  document.getElementById('detHero').innerHTML=`<div class="det-hero-top">
    <div><div class="det-pname">${prod}</div><div class="det-val">${fK(l[prod])}</div>
      <div class="det-unit">millones COP · ${fDt(l.Fecha)}</div>
      <div class="det-deltas">
        ${pct!=null?`<span class="det-d" style="background:${pct>=0?'rgba(0,146,122,.3)':'rgba(192,57,43,.3)'};color:${pct>=0?'#8ff5b0':'#ffaaaa'}">${fP(pct)} en el período</span>`:''}
        ${pctD!=null?`<span class="det-d" style="background:rgba(255,255,255,.07);color:rgba(255,255,255,.5)">${fP(pctD)} vs día ant.</span>`:''}
      </div>
    </div>
    <div class="det-stats-r">
      <div><div class="ds-lbl">Mínimo</div><div class="ds-val">${fK(minV)}</div></div>
      <div><div class="ds-lbl">Promedio</div><div class="ds-val">${fK(avgV)}</div></div>
      <div><div class="ds-lbl">Máximo</div><div class="ds-val">${fK(maxV)}</div></div>
    </div>
  </div>`;
  const dense=data.length>90;dC('chDetLine');
  new Chart(document.getElementById('chDetLine'),{type:'line',
    data:{labels:data.map(r=>r.Fecha),datasets:[{label:prod,data:data.map(r=>+(r[prod]/1e6).toFixed(3)),
      borderColor:p.c,backgroundColor:p.c+'22',borderWidth:2.5,pointRadius:dense?0:2.5,pointHoverRadius:5,tension:0.4,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{callbacks:{title:t=>fDt(t[0].label),label:t=>` ${t.parsed.y.toLocaleString('es-CO',{minimumFractionDigits:3,maximumFractionDigits:3})} M`}}},
      scales:{x:{ticks:{maxTicksLimit:12,font:{size:10},callback:(v,i)=>{const d=data[i]?.Fecha;return d?`${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(2,4)}`:'';}},grid:{display:false}},
        y:{ticks:{font:{size:10},callback:v=>v.toLocaleString('es-CO',{maximumFractionDigits:0})+' M'},grid:{color:'#e8ede9'}}}}
  });
  const bM={};data.forEach(r=>{const k=r.Fecha.slice(0,7);if(!bM[k]){bM[k]={s:0,n:0};}bM[k].s+=r[prod];bM[k].n++;});
  const mks=Object.keys(bM).sort();dC('chDetBar');
  new Chart(document.getElementById('chDetBar'),{type:'bar',
    data:{labels:mks.map(k=>`${MS[parseInt(k.slice(5,7))]} ${k.slice(2,4)}`),
      datasets:[{label:'Prom',data:mks.map(k=>+(bM[k].s/bM[k].n/1e6).toFixed(3)),backgroundColor:p.c+'99',borderColor:p.c,borderWidth:1,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:t=>` ${t.parsed.y.toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})} M`}}},
      scales:{x:{ticks:{maxTicksLimit:14,font:{size:10},maxRotation:45},grid:{display:false}},
        y:{ticks:{font:{size:10},callback:v=>v.toLocaleString('es-CO',{maximumFractionDigits:0})+' M'},grid:{color:'#e8ede9'}}}}
  });
  const t12=data.length>=12?((data[data.length-1][prod]-data[data.length-12][prod])/data[data.length-12][prod]*100):null;
  const rows=[
    ['Saldo actual',fK(l[prod])],['Saldo inicial período',fK(f[prod])],
    ['Variación total',`<span class="${pct>=0?'cup':'cdn'}">${pct!=null?fP(pct):'—'}</span>`],
    ['Variación vs día ant.',`<span class="${pctD>=0?'cup':'cdn'}">${pctD!=null?fP(pctD):'—'}</span>`],
    ['Mínimo período',fK(minV)],['Máximo período',fK(maxV)],['Promedio período',fK(avgV)],
    ['Tendencia 12 días',t12!=null?`<span class="${t12>=0?'cup':'cdn'}">${fP(t12)}</span>`:'—'],['Días con datos',vals.length.toString()]
  ];
  document.getElementById('detStats').innerHTML=`<table class="stbl"><tbody>${rows.map(([l,v])=>`<tr><td style="color:var(--tx3)">${l}</td><td>${v}</td></tr>`).join('')}</tbody></table>`;
}

  xhr.onload=function(){if(xhr.status===200){const url=URL.createObjectURL(xhr.response);const a=document.createElement('a');a.href=url;a.download='Ev_Saldos_PowerBi.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a);},500);}btn.innerHTML=orig;btn.disabled=false;};
  xhr.onerror=function(){alert('Error al descargar');btn.innerHTML=orig;btn.disabled=false;};
  xhr.send();
}
